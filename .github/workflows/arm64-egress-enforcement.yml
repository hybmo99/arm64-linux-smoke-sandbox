name: ARM64 egress enforcement - synthetic only
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN_SYNTHETIC_ARM64_EGRESS_ENFORCEMENT to run the disposable firewall-enforcement test'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: arm64-egress-enforcement
  cancel-in-progress: false
jobs:
  arm64-egress-enforcement:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
           github.ref == 'refs/heads/main' &&
           github.actor == 'hybmo99' &&
           inputs.confirm == 'RUN_SYNTHETIC_ARM64_EGRESS_ENFORCEMENT' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - name: Obtain public test source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Firewall enforcement probe (network namespace only; no host firewall change)
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 180s sudo --preserve-env=GITHUB_RUN_ID,ImageVersion,ImageOS bash scripts/egress_enforcement.sh
      - name: Idempotent cleanup and residue check (runs even after a failure or timeout)
        if: ${{ always() }}
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 60s sudo --preserve-env=GITHUB_RUN_ID bash scripts/egress_enforcement.sh cleanup-verify
